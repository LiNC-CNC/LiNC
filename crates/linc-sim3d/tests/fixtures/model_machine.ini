; Machine INI fixture for crates/linc-sim3d/tests/model.rs.
; Limits match the machine travel the simulator models: -372/5, -346/4,
; -253/19 (the real configs/sim.ini trims its soft limits inside these).
[EMC]
MACHINE = Model Fixture Mill
VERSION = 1.1

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
SPINDLES = 1

[EMCIO]
TOOL_TABLE = model_tool.tbl
TOOL_TABLE_COLUMNS = TZDR

[AXIS_X]
MIN_LIMIT = -372.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 60.0

[AXIS_Y]
MIN_LIMIT = -346.0
MAX_LIMIT = 4.0
MAX_VELOCITY = 60.0

[AXIS_Z]
MIN_LIMIT = -253.0
MAX_LIMIT = 19.0
MAX_VELOCITY = 30.0
