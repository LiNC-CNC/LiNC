<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LiNC">
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1e22"/>
      <stop offset="0.52" stop-color="#141619"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>
    <linearGradient id="frame" x1="120" y1="104" x2="392" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#2f7fe0"/>
    </linearGradient>
    <linearGradient id="table" x1="208" y1="322" x2="336" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <clipPath id="tool">
      <path d="M260 252H284V306L272 318L260 306Z"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="#30353a" stroke-width="6"/>

  <!-- C frame, interrupted at the spindle head -->
  <path d="M158 104H222V170H176V358H392V424H176L122 382V142Z"
        fill="url(#frame)"/>
  <rect x="322" y="104" width="70" height="66" fill="url(#frame)"/>

  <!-- Spindle head and flange -->
  <rect x="230" y="94" width="84" height="100" rx="6" fill="#e8eaed"/>
  <path d="M230 194H314L305 212H239Z" fill="#4da3ff"/>

  <!-- Quill -->
  <rect x="254" y="222" width="36" height="22" rx="3" fill="#9aa0a6"/>

  <!-- Straight-fluted tool with a shallow V tip -->
  <path d="M260 252H284V306L272 318L260 306Z" fill="#fb923c"/>
  <g clip-path="url(#tool)" stroke="#141619" stroke-width="5" stroke-linecap="butt">
    <path d="M260 270L284 258"/>
    <path d="M260 286L284 274"/>
    <path d="M260 302L284 290"/>
  </g>

  <!-- Work table, notch centered on the tool -->
  <path d="M208 322H254L272 336L290 322H336V348H208Z" fill="url(#table)"/>
