# BaierMill simulation profile.
#
# Uses the existing LinuxCNC simulation configuration in ../../baiermill_sim.
# Same machine geometry, limits, velocities, homing, ATC and tooling as the
# real machine; the FPGA card, CNC control panel and pendant are software stand-ins.

schema_version = 1
profile = "sim"
extends = "base.toml"

[machine]
name = "BaierMill Simulation"
kind = "sim"
gui = "mill"
linuxcnc_ini = "sim.ini"

[mill]
max_axes = 5

[ui]
window_title = "LiNC - BaierMill Simulation"
# This development display runs at 125%; 0.8 keeps the 1920x1080 layout intact.
scale = "0.8"

[panel]
kind = "simulated"
label = "Simulated CNC control panel"
owner = "linc-panel"
driver = "cnc-panel-sim"

[panel.link]
kind = "virtual"

[diagnostics]
panel_link_stats = "none"

[simulation]
enabled = true
rio = "../../baiermill_sim/rio_sim.py"
estop = "panel-gui"
panel_window = true
panel_title = "CNC Control Panel Simulator"
panel_scale = 1.0
