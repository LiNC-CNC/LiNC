# LiNC + real LinuxCNC simulation config.
#
# Self-contained simulation: the software FPGA HAL (../hal/rio_sim.hal) and
# its component (../hal/rio_sim.py), the tool table and the sample programs
# live in this checkout. The Probe Basic GUI and Qt panel are replaced by
# LiNC. LinuxCNC owns motion; linc-panel owns the simulated CNC control panel
# and linc is the display.
#
# Launch through ../scripts/start-sim.sh. Paths are relative to this file's
# directory, which is also where LinuxCNC runs and keeps the parameter file.

[EMC]
MACHINE = BaierMill Simulation
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = ../scripts/linc-display.sh
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
OPEN_FILE = gcode/blank.ngc
CONFIRM_EXIT = False
LOG_FILE = linc-sim.log
LOG_LEVEL = INFO
PREFERENCE_FILE = linc-sim.pref
CONFIG_FILE = custom_config.yml
GCODE_SYNTAX = gcode_syntax.yml
POSITION = 0x0
ANGULAR_INCREMENTS = 1 5 10 30 45 90 180 360
INCREMENTS = JOG 10mm 1mm .1mm .01mm

MAX_FEED_OVERRIDE = 2.000000

MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.500000
DEFAULT_SPINDLE_SPEED = 300
MIN_SPINDLE_SPEED = 0
MAX_SPINDLE_SPEED = 12000

DEFAULT_LINEAR_VELOCITY = 60.00000
MAX_LINEAR_VELOCITY = 80.0
MIN_LINEAR_VELOCITY = 0.016670
DEFAULT_ANGULAR_VELOCITY = 36.000000
MAX_ANGULAR_VELOCITY = 360.000000
MIN_ANGULAR_VELOCITY = 1.666667
PROGRAM_PREFIX = gcode
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 5

GEOMETRY = xyz
# USER_TABS_PATH - Set this to enable custom user tabs including NgcGui
# The ngcgui_tab folder should be placed in the user_tabs directory
USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XYZ
GEOMETRY = XYZ
OFFSET_COLUMNS = XYZR
TOOL_TABLE_COLUMNS = TZDR
KEYBOARD_JOG = false
KEYBOARD_JOG_SAFETY_OFF = false
# ATC tab display options, 0 = no atc tab displayed, 1 = Carousel atc display, 2 = rack atc display
ATC_TAB_DISPLAY = 0
#USER_ATC_BUTTONS_PATH = user_atc_buttons/

# NGCGUI Configuration - Optional preloaded subroutines
# These files should be in your SUBROUTINE_PATH directory
# NGCGUI_PREAMBLE = preamble.ngc
# NGCGUI_POSTAMBLE = postamble.ngc
# NGCGUI_SUBFILE = sub1.ngc sub2.ngc  # Space-separated list of subroutine files to preload

[ATC]
# Carousel images are available for 8, 10, 12, 14, 16, 18, 20, 21, 24 pocket changers
POCKETS = 12
# The Z clearance height in machine coordinates your spindle needs to be at to clear the tools during carousel rotation
Z_TOOL_CLEARANCE_HEIGHT = 0.0000
# Step Time should be set to the approximate time it takes your ATC to rotate from one pocket to the next entry is in milliseconds(1 second = 1000ms)
# This just adjust the speed of the ATC tab Carousel GFX rotation (default if omitted is 1000ms)
#
# The Z height your spindle needs to be at to clamp/unclamp a tool from the ATC platter
Z_TOOL_CHANGE_HEIGHT = -194.0
STEP_TIME = 500
TABLE_POCKET_1_X = 4
TABLE_POCKET_1_Y = -3.6
TABLE_POCKET_SPACING = 100
TABLE_POCKET_OFFSET_AFTER_3 = 0
TABLE_POCKET_AXIS = 0

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
    png = image-to-gcode
    gif = image-to-gcode
    jpg = image-to-gcode


[TASK]
TASK = milltask
CYCLE_TIME = 0.01

[RS274NGC]
RS274NGC_STARTUP_CODE = F10 S300 G21 G17 G40 G49 G54 G64 P0.0005 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = sim.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
# Probe Basic's probing routines and LiNC's documented Apply context live under
# ../subroutines/probe_basic. Keep them ahead of the ngcgui examples.
SUBROUTINE_PATH = ../subroutines/probe_basic:~/linuxcnc/nc_files/examples/ngcgui_lib:~/linuxcnc/nc_files/examples/ngcgui_lib/utilitysubs
# A probe aborted after M50 P0 must restore feed override. The subroutines
# restore it on normal completion only.
ON_ABORT_COMMAND = O<on_abort> CALL

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.01
BASE_PERIOD = 0
SERVO_PERIOD = 1000000
NUM_DIO = 16
NUM_AIO = 16

[HAL]
# LinuxCNC owns the machine. The reference simulation HAL provides the
# software FPGA and pendant signals; LiNC provides the panel service and HMI.
HALFILE = ../hal/rio_sim.hal
HALFILE = ../hal/linc.hal
HALFILE = ../hal/linc-sim.hal
# The 3D simulator publishes modelled probe contact. Loaded after linc.hal,
# which creates or2.probe_sim3d, and before the display.
HALFILE = ../hal/linc-sim3d.hal
POSTGUI_HALFILE = ../hal/linc-sim-postgui.hal
HALUI = halui

[HALUI]
MDI_COMMAND = G92 X0
MDI_COMMAND = G92 Y0
MDI_COMMAND = G92 Z0
MDI_COMMAND = o<whome> call
MDI_COMMAND = o<safez> call
MDI_COMMAND = M19 R0
MDI_COMMAND = o<go_to_home> call


[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.01
DEFAULT_LINEAR_VELOCITY = 60.0
MAX_LINEAR_VELOCITY = 80.0
DEFAULT_ANGULAR_VELOCITY = 60.0
MAX_ANGULAR_VELOCITY = 100.0
NO_FORCE_HOMING = 0
SPINDLES = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.1
TOOL_TABLE = tool.tbl

# Soft limits sit inside the machine's travel (-372/5, -346/4, -253/19): 5 mm off
# the minimum and 3 mm off the maximum, so machine zero is always inside the
# range. An earlier 5 mm trim put Y's maximum at -1, and powering on at zero
# immediately reported a limit switch. Both the AXIS and JOINT sections carry
# them, because teleop jogging reads the axis limits and joint jogging reads the
# joint ones.
[AXIS_X]
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
MIN_LIMIT          = -367.0
MAX_LIMIT          = 2.0
MIN_FERROR         = 0.01
FERROR             = 0.3

[JOINT_0]
# stepdir0
# Option B PID, Step 4: P tuned (X baseline). FF1=1 velocity ff, I=0 D=0.
P                  = 150.0
I                  = 0.0
D                  = 4.0
BIAS               = 0.0
FF0                = 0.0
FF1                = 1.0
FF2                = 0.0
DEADBAND           = 0.001
MAXOUTPUT          = 300.0
BACKLASH           = 0.03

TYPE               = LINEAR
FERROR             = 0.3
MIN_LIMIT          = -367.0
MAX_LIMIT          = 2.0
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
SCALE              = 1999.2
HOME_SEARCH_VEL    = 30.0
HOME_LATCH_VEL     = -5.0
HOME_FINAL_VEL     = 100.0
HOME_IGNORE_LIMITS = NO
HOME_USE_INDEX     = YES
HOME_INDEX_NO_ENCODER_RESET = NO
HOME_OFFSET        = 0
HOME               = 0.0
HOME_SEQUENCE      = 2

[AXIS_Y]
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
MIN_LIMIT          = -341.0
MAX_LIMIT          = 1.0
MIN_FERROR         = 0.01
FERROR             = 0.3

[JOINT_1]
# stepdir1
# Option B PID, Step 4: P tuned. FF1=1 velocity ff, I=0 D=0.
P                  = 125.0
I                  = 0.0
D                  = 4.0
BIAS               = 0.0
FF0                = 0.0
FF1                = 1.0
FF2                = 0.0
DEADBAND           = 0.001
MAXOUTPUT          = 300.0
BACKLASH           = 0.06

TYPE               = LINEAR
FERROR             = 0.3
MIN_LIMIT          = -341.0
MAX_LIMIT          = 1.0
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
SCALE              = 1999.7469487588498
HOME_SEARCH_VEL    = 30.0
HOME_LATCH_VEL     = 1.0
HOME_FINAL_VEL     = 100.0
HOME_IGNORE_LIMITS = NO
HOME_USE_INDEX     = YES
HOME_INDEX_NO_ENCODER_RESET = NO
HOME_OFFSET        = 0
HOME               = 0.0
HOME_SEQUENCE      = 2

[AXIS_Z]
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
MIN_LIMIT          = -248.0
MAX_LIMIT          = 16.0
MIN_FERROR         = 0.01
FERROR             = 0.3

[JOINT_2]
# stepdir2
# Option B PID: Z gravity ring fixed with D=1; deadband 0.005 silences D-amplified encoder noise.
P                  = 100.0
I                  = 0.0
D                  = 2.0
BIAS               = 0.0
FF0                = 0.0
FF1                = 1.0
FF2                = 0.0
DEADBAND           = 0.003
MAXOUTPUT          = 300.0
BACKLASH           = 0.01

TYPE               = LINEAR
FERROR             = 0.3
MIN_LIMIT          = -248.0
MAX_LIMIT          = 16.0
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
SCALE              = 1000.4
HOME_SEARCH_VEL    = 30.0
HOME_LATCH_VEL     = -5.0
HOME_FINAL_VEL     = 100.0
HOME_IGNORE_LIMITS = NO
HOME_USE_INDEX     = YES
HOME_INDEX_NO_ENCODER_RESET = NO
HOME_OFFSET        = 0
HOME               = 0.0
HOME_SEQUENCE      = 1
