# Shared defaults for all LiNC machine profiles.
#
# Do not launch the HMI with this file directly. It has no machine profile.
# A machine profile loads this file via `extends` and then overrides fields.
#
# The LinuxCNC INI named by the machine profile is authoritative for machine
# geometry, travel limits, velocities, units, spindle count, ATC pockets, the
# tool table and the program prefix. Do not copy those values here.

schema_version = 1

[ui]
theme = "graphite-blue"
start_page = "machine"
window_title = "LiNC"
# "auto" follows the desktop scale; otherwise 0.5..3.0 or a percentage.
scale = "auto"
axis_order = ["X", "Y", "Z"]
# Order matches the keyboard: MAIN, FILE, TOOL, OFFSET, WIN.
pages = [
    "machine",
    "program",
    "tools",
    "offsets",
    "diagnostics",
    "plc",
    "help",
]
# Load bars on the Machine page: machine axes plus "S" for the spindle. An
# empty list removes the SERVO LOAD pane.
servo_load = ["X", "Y", "Z"]

[program]
default_view = "split"
load_view = "split"
views = ["split", "code"]
edit_view = "code"
line_numbers = true
highlight_current_line = true
autosave = false
live_preview = true
preview_requires_syntax_ok = true
preview_debounce_ms = 250
tab_width = 4

[files]
# NC_FILES is derived from the LinuxCNC INI PROGRAM_PREFIX; do not duplicate it.
nc_files = "ini"
usb_backend = "udisks2"
usb_automount = true
usb_mount_options = ["nosuid", "nodev", "noexec"]  # loader floor; cannot remove
load_extensions = [".ngc", ".nc", ".tap", ".txt"]
overwrite = "confirm"
copy_while_running = false
# NC_FILES normally stops at PROGRAM_PREFIX. Enable this to show its `..` row
# at the root and browse (read-only) above it; loading still requires a file
# inside NC_FILES.
show_parent_above_root = false

[probe]
enabled = true
tool_number = 99
wcs = "G54"
# Use the LinuxCNC INI SUBROUTINE_PATH; do not duplicate it here.
subroutines = "ini"
clearance = 5.0
probe_depth = 10.0
fast_feed = 500.0
slow_feed = 50.0
probe_diameter = 4.0
max_travel = 10.0
calibration_diameter = 50.0

[tools]
changer = "manual"          # manual | atc | turret
atc_pockets = "ini"         # derive from [ATC] POCKETS
manual_confirm = true

[manual]
# Panel modes JOG/INC/MPG drive this read-only screen.
auto_open = true
close_on_mode_exit = true
show_machine_coordinates = true
show_dtg = true
trail = true

[homing]
# Panel mode HOME/PROG.HOME drives this page. The HMI never homes an axis.
auto_open = true
close_on_mode_exit = true

[mdi]
# Enter issues through Probe Basic issue_mdi; no staging, no cycle-start gate.
execute_on_enter = true
auto_focus = true
# Cap on the MDI block buffer. The buffer survives leaving the mode, so this is
# the session's block count, not one visit's.
history_limit = 50
max_command_length = 256
# Ctrl+S writes the buffer to a new .ngc file. The preamble runs before the
# blocks and the postamble after them; the dialog's checkbox turns both off.
# G17 is the mill plane: a lathe profile overrides it with G18.
save_preamble = ["G17", "G21", "G40", "G49", "G80", "G90"]
save_postamble = ["M5", "M9", "M30"]

[toolpath]
show_grid = false
show_live_trail = true
trail_max_points = 100000
clear_trail_action = true
show_program_bounds = true
show_machine_bounds = false
# Stock envelope drawn from the program extents (SPEC §6.1).
show_stock = true
# 0 = no stock block at all; raise it to show a translucent envelope.
stock_alpha = 0
show_program_labels = true
show_machine_labels = false
show_program_ticks = false
show_machine_ticks = false
perspective = true
multitool_colors = true
highlight_selected_line = true

[keys]
machine = "F5"
program = "F6"
# CODE/SPLIT on the Program page. Shown in the hint row as a square, not as
# an F-key: F5-F10 are implicit navigation keys and are never listed.
program_cycle_view = "F10"
view_cycle = "Ctrl+F10"
# Show the program bounding box with its dimension lines.
toggle_bounds = "Ctrl+B"
# Lathe only: mirror X about the Z centreline in the XZ/TURN toolpath. The
# projection flips on screen; no coordinate and no machine value changes.
toggle_lathe_mirror = "Ctrl+M"
# Lathe only: read the X position as a radius (X) or a diameter (2X).
toggle_lathe_diameter = "Ctrl+E"
# Page-local to Program: fit the toolpath, clear the live trail.
graph_fit = "Ctrl+0"
graph_clear = "Ctrl+L"
goto_line = "Ctrl+G"
# Page-local to Program: start the loaded program at a line.
program_run_from_line = "Ctrl+R"
# The CNC keyboard has no Delete key: the Files page deletes with Backspace.
# Delete is kept for a desktop keyboard.
files_delete = "Delete"
tools = "F7"
offsets = "F8"
# There is no F9 on the panel: DIAGNOSTICS takes Ctrl+D and G-CODE HELP Ctrl+H;
# F10 carries CODE/SPLIT and Esc is back/cancel.
diagnostics = "Ctrl+D"
help = "Ctrl+H"
# Full-screen messages dialog.
messages = "M"
back = "Escape"
quit = "Ctrl+Q"
focus_next = "Down"
focus_prev = "Up"
activate = "Enter"
open = "Ctrl+O"
save = "Ctrl+S"
undo = "Ctrl+Z"
redo = "Ctrl+Y"
find = "Ctrl+F"
select_all = "Ctrl+A"
# Ctrl+C/Ctrl+X/Ctrl+V are text-editing chords. The Probe page's Ctrl+X (X data
# reset) does not come from this binding: the shell hands egui-winit's Cut event
# to that page alone, and suppresses it while a text editor has focus.
copy = "Ctrl+C"
cut = "Ctrl+X"
paste = "Ctrl+V"
refresh = "Ctrl+R"
mdi_issue = "Enter"
mdi_clear = "Escape"
mdi_history_up = "Up"
mdi_history_down = "Down"
# Move the selected buffer block. Ctrl, not Shift: the CNC keyboard has no Shift
# key (AGENTS.md "Keyboard reality"), and the plain arrows recall.
mdi_line_up = "Ctrl+Up"
mdi_line_down = "Ctrl+Down"
# The panel has no Delete key; Ctrl+Backspace drops the selected buffer block.
mdi_buffer_delete = "Ctrl+Backspace"
help_search = "/"

[help]
# Offline LinuxCNC G-code reference bundled with the HMI.
source = "bundled"
bundle = "linuxcnc-gcode"
search = true
history_limit = 32

[jog]
# Continuous jog ceilings in machine units per minute, reached at 100 %.
# RAPID on the panel switches to the higher ceiling while it is held; the
# machine still clamps to its own MAX_VELOCITY.
max_speed = 3000
rapid_speed = 6000

[safety]
# The physical panel is the primary machine-control surface. MDI, probe and
# tool-change actions are explicit exceptions. These flags are policy, not
# user preferences: a profile must not turn them on.
machine_control = "panel-with-explicit-mdi"
software_estop = false
software_cycle_control = false
software_jog = false
software_spindle = false
software_coolant = false
software_overrides = false
program_edit_while_running = "read-only"
program_protect = "panel"          # hardware switch; unknown/stale = locked
save_requires_idle = true
confirm_discard = true
mdi_execution = "explicit-action-only"
quit_requires_idle = true
confirm_quit = true

[backend]
kind = "linuxcnc"
# Native in-process NML. There is no Python helper and no JSON bridge.
transport = "nml"
status_hz = 20
hal_hz = 10
connect_timeout_ms = 3000

[hal]
panel_component = "cnc_panel"
linc_component = "linc"
write_policy = "declared-outputs-only"
output_prefix = "linc."
allowed_outputs = ["hmi-alive", "tool-change-confirm", "status-display", "jog-increment", "jog-speed"]

[hal.pins]
panel_connected = "cnc_panel.panel_connected"
panel_error = "cnc_panel.communication_error"
program_protect = "cnc_panel.program_protect"
feed_override = "cnc_panel.feed_override"
rapid_override = "cnc_panel.rapid_override"
spindle_override = "cnc_panel.spindle_override"
spindle_load = "rio.spindle-modbus.spindle_load-abs"
spindle_speed = "spindle.0.speed-in"

[panel]
# Panel I/O is owned by the linc-panel service. The HMI never opens the serial
# device or writes cnc_panel.* pins; it writes only the linc.* allowlist above.
owner = "linc-panel"
kind = "physical"
driver = "cnc-panel"
mode_encoding = "one_hot_steady"
override_encoding = "analog_steady"
read_only = true

[panel.status]
# Two-digit status display driven by linc.status-display:
# active WCS 54-59, spindle load 0-99, or MM/IN.
source = "wcs"
unknown = "--"

[panel.link]
read_only = true

[pendant]
# WHB04B-6 jog-only input. Other pendant controls must be unwired/ignored.
enabled = true
kind = "whb04b6"
jog_only = true
ignored_functions = ["mode", "cycle", "spindle", "coolant", "overrides", "program", "macro", "probe"]

[preferences]
# Runtime-only UI state lives here, never in the machine profile.
# {profile} expands to the selected profile name.
file = "~/.config/linc/{profile}.preferences.toml"

[diagnostics]
event_log_capacity = 1000
# "none": no link counters exist; "optional": show them if exposed; "required":
# fail diagnostics if they are missing.
panel_link_stats = "optional"

[simulation]
enabled = false

[plc]
# Ladder PLC service (linc-plc). OFF by default: with enabled = false the HMI
# starts no daemon, no linc_plc.* pins exist and no PLC HAL file is loaded.
# Turn it on here, or for one simulation run with `start-sim.sh --plc`
# (`--no-plc` forces it off for one run).
enabled = false
# Ladder project JSON, resolved relative to this profile's directory.
# Required when enabled = true.
project = ""
# Daemon socket. Empty uses linc_plc_client::default_socket_path()
# ($XDG_RUNTIME_DIR/linc/plc-<uid>.sock); a relative path resolves against the
# profile directory.
socket = ""
# Scan period in microseconds, 100..=1000000.
scan_us = 2000
# Let the PLC page force I/O for diagnostics; the daemon refuses forces without it.
allow_force = false
