# Shared defaults for all CNC HMI machine profiles.
#
# Do not launch the HMI with this file directly. It has no machine profile.
# A machine profile loads this file via `extends` and then overrides fields.
#
# The LinuxCNC INI named by the machine profile is authoritative for machine
# geometry, travel limits, velocities, units, spindle count, ATC pockets, the
# tool table and the program prefix. Do not copy those values here.

schema_version = 1

[ui]
theme = "graphite-blue"
start_page = "machine"
window_title = "CNC HMI"
scale = "auto"
axis_order = ["X", "Y", "Z"]
pages = ["machine", "program", "offsets", "tools", "diagnostics", "help"]

[program]
default_view = "split"
load_view = "split"
views = ["split", "code"]
edit_view = "code"
line_numbers = true
highlight_current_line = true
autosave = false
live_preview = true
preview_requires_syntax_ok = true
preview_debounce_ms = 250
tab_width = 4

[files]
# NC_FILES is derived from the LinuxCNC INI PROGRAM_PREFIX; do not duplicate it.
nc_files = "ini"
usb_backend = "udisks2"
usb_automount = true
usb_mount_options = ["nosuid", "nodev", "noexec"]
load_extensions = [".ngc", ".nc", ".tap", ".txt"]
overwrite = "confirm"
copy_while_running = false

[probe]
enabled = true
tool_number = 99
wcs = "G54"
# Use the LinuxCNC INI SUBROUTINE_PATH; do not duplicate it here.
subroutines = "ini"
clearance = 5.0
probe_depth = 10.0
fast_feed = 500.0
slow_feed = 50.0
probe_diameter = 4.0
max_travel = 10.0
calibration_diameter = 50.0
prepare_only = true

[mdi]
# The HMI stages a block; only the physical CYCLE START key runs it.
stage_only = true
auto_focus = true
history_limit = 50
max_command_length = 256
quick_commands = ["G0", "G1", "G2", "G3", "M3", "M5", "M6", "M8", "M9", "G54", "G38.2", "T"]

[toolpath]
show_grid = false
show_program_bounds = true
show_machine_bounds = true
show_program_labels = true
show_machine_labels = false
show_program_ticks = false
show_machine_ticks = false
perspective = true
multitool_colors = true
highlight_selected_line = true

[keys]
machine = "F5"
program = "F6"
program_cycle_view = "F6"
tools = "F7"
offsets = "F8"
diagnostics = "F10"
back = "Escape"
quit = "Ctrl+Q"
focus_next = "Down"
focus_prev = "Up"
activate = "Enter"
open = "Ctrl+O"
save = "Ctrl+S"
undo = "Ctrl+Z"
redo = "Ctrl+Y"
find = "Ctrl+F"
select_all = "Ctrl+A"
mdi_stage = "Enter"
mdi_clear = "Escape"
mdi_history_up = "Up"
mdi_history_down = "Down"
help_search = "/"

[help]
# Offline LinuxCNC G-code reference bundled with the HMI.
source = "bundled"
bundle = "linuxcnc-gcode"
search = true
history_limit = 32

[safety]
# The physical panel is the only machine-control surface. These flags are
# policy, not user preferences: a profile must not turn them on.
machine_control = "panel-only"
software_estop = false
software_cycle_control = false
software_jog = false
software_spindle = false
software_coolant = false
software_overrides = false
program_edit_while_running = "read-only"
program_protect = "panel"
save_requires_idle = true
confirm_discard = true
mdi_requires_mode = "mdi"
quit_requires_idle = true
confirm_quit = true

[backend]
kind = "linuxcnc"
transport = "pyo3"
status_hz = 20
hal_hz = 10
connect_timeout_ms = 3000

[hal]
read_only = true
panel_component = "szgh_panel"
# Mode pins are 0.5 s pulses, not a persistent mode index. The HMI latches them
# to track the physical selector, including EDIT.
panel_mode_prefix = "szgh_panel.mode_"

[hal.pins]
panel_connected = "szgh_panel.panel_connected"
panel_error = "szgh_panel.communication_error"
program_protect = "szgh_panel.program_protect"
feed_override = "szgh_panel.feed_override"
rapid_override = "szgh_panel.rapid_override"
spindle_override = "szgh_panel.spindle_override"
spindle_load = "rio.spindle-modbus.spindle_load-abs"
spindle_speed = "spindle.0.speed-in"

[panel]
# The panel is owned by another process. The HMI must never open the serial
# device, load the panel component, or write panel outputs.
owner = "external"
kind = "external"
read_only = true

[panel.link]
read_only = true

[preferences]
# Runtime-only UI state lives here, never in the machine profile.
# {profile} expands to the selected profile name.
file = "~/.config/cnc-hmi/{profile}.preferences.toml"

[diagnostics]
event_log_capacity = 1000
# "none": no link counters exist; "optional": show them if exposed; "required":
# fail diagnostics if they are missing.
panel_link_stats = "optional"

[simulation]
enabled = false
