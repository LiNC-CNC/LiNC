# LiNC lathe simulation configuration.
#
# The geometry, HAL and tool table are Probe Basic's lathe simulation (a
# sibling checkout); the GUI is LiNC. Launch through
# ../scripts/start-lathe-sim.sh, which checks that checkout exists.
#
# Paths are relative to this file's directory, which is where LinuxCNC runs
# and keeps the parameter file.
#
# The lathe panel's HAL binding is not commissioned yet: this session runs
# LiNC against the simulated lathe with no cnc_panel.* wiring, so the HMI
# starts with the panel offline. The lathe panel window and its turret/live
# tool controls are the follow-up.

[EMC]
VERSION = 1.1
MACHINE = Smartlathe SL36 Simulation
DEBUG = 0

[DISPLAY]
DISPLAY = ../scripts/linc-display.sh
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
CONFIRM_EXIT = False
LOG_FILE = lathe-sim.log
LOG_LEVEL = INFO
PROGRAM_PREFIX = gcode
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.500000
DEFAULT_SPINDLE_SPEED = 300
BACK_TOOL_LATHE = 1
MASTER_TOOL_OFFSET_MODE = true
DRO_DISPLAY = XZ
GEOMETRY = XZ
OFFSET_COLUMNS = XZ
# The P column is the turret station: LiNC refuses a turret profile without it.
TOOL_TABLE_COLUMNS = TPXZIJDQR

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files

[RS274NGC]
RS274NGC_STARTUP_CODE = G90 G7 G18 G95 G96 D2000 S200
PARAMETER_FILE = lathe-sim.var
SUBROUTINE_PATH = ../../probe_basic_dev/configs/probe_basic_lathe/subroutines

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = ../../probe_basic_dev/configs/probe_basic_lathe/hallib/core_sim_2.hal
HALFILE = ../../probe_basic_dev/configs/probe_basic_lathe/hallib/simulated_home_xz.hal
HALFILE = ../../probe_basic_dev/configs/probe_basic_lathe/hallib/simulated_lathe.hal
HALUI = halui

[HALUI]

[TRAJ]
AXES = 2
SPINDLES = 2
COORDINATES = X Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
DEFAULT_VELOCITY = 1.0
MAX_LINEAR_VELOCITY = 3.333334
DEFAULT_ACCELERATION = 20.0
MAX_ACCELERATION = 20.0
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = lathe-sim.tbl

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

[AXIS_X]
MIN_LIMIT = -5.0
MAX_LIMIT = 5.0
MAX_VELOCITY = 3.333334
MAX_ACCELERATION = 20.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 3.333334
MAX_ACCELERATION = 20.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
MIN_LIMIT = -5.0
MAX_LIMIT = 5.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 1.0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 1.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0
HOME_IS_SHARED = 1

[AXIS_Z]
MIN_LIMIT = 0
MAX_LIMIT = 12.0
MAX_VELOCITY = 3.333334
MAX_ACCELERATION = 20.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 3.333334
MAX_ACCELERATION = 20.0
BACKLASH = 0.000
INPUT_SCALE = 4000
OUTPUT_SCALE = 1.000
MIN_LIMIT = 0.0
MAX_LIMIT = 12.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 1.0
HOME_SEARCH_VEL = 5.0
HOME_LATCH_VEL = 1.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1
