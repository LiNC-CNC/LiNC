# Smartlathe SL36-style lathe simulation profile.
#
# Uses configs/lathe-sim.ini, which boots LiNC as the display against Probe
# Basic's lathe simulation HAL (a sibling checkout). The lathe has no physical
# panel, so the simulator panel window stands in for one; it is a separate
# process, not part of the HMI shell. gui = "lathe" (and [panel] driver =
# "lathe-sim") selects the lathe face of that window: the lathe key matrix,
# NC/PLC/MMC/EMG alarm lamps and TOOL / TOOL COMP. / STATUS windows.
# hal/linc-lathe.hal wires the controls it can drive; the rest stay grey.

schema_version = 1
profile = "lathe-sim"
extends = "base.toml"

[machine]
name = "Smartlathe SL36 Simulation"
kind = "sim"
gui = "lathe"
linuxcnc_ini = "lathe-sim.ini"

[tools]
changer = "turret"
# Commissioning requirement: add the standard P station column when the power
# turret is enabled. The current lathe table is TXZIJDQR.

[mdi]
# The lathe writes arcs in XZ, so a saved program must not carry base's G17
# (XY plane). Everything else stays at the base preamble and postamble.
save_preamble = ["G18", "G21", "G40", "G49", "G80", "G90"]

[probe]
enabled = false

[lathe]
turret_stations = 12
power_turret = true
live_tooling = true
live_tool_max_rpm = 6000
c_axis = true
y_axis = false
# The lathe simulation INI runs [TRAJ] SPINDLES = 2 and the reference photo
# has the SPD.2.* row, so this machine has a second spindle. Set false for a
# single-spindle lathe: the panel then draws only the SPD.* column.
sub_spindle = true

[jog]
# The lathe INI is in inch units (MAX_VELOCITY 3.33 in/s = 200 in/min). Base's
# mill defaults (3000/6000) would drive the axis into its limit instantly.
max_speed = 100
rapid_speed = 200

[ui]
window_title = "LiNC - Smartlathe SL36 Simulation"
servo_load = ["X", "Z", "S"]

[panel]
kind = "simulated"
label = "Lathe Simulator Panel"
owner = "linc-panel"
driver = "lathe-sim"
mode_encoding = "one_hot_steady"
override_encoding = "analog_steady"

[pendant]
enabled = false

[panel.link]
kind = "virtual"

[diagnostics]
panel_link_stats = "none"

[simulation]
enabled = true
# The lathe has no physical panel; the simulator panel window stands in for
# it, drawing the lathe face. Only the wired controls act (power, E-stop,
# AUTO/MDI/JOG, cycle, X/Z jog, spindle, feed brake); the remaining
# machine I/O (tailstock, chip, turret/TOOL CHG., worklamp, chuck, MST, C/S,
# C-axis jog, SPD. JOG) has no equivalent here and stays grey.
panel_window = true
