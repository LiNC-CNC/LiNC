# Smartlathe SL36-style lathe simulation profile.
#
# Uses the existing Probe Basic lathe simulation INI. The lathe panel mockup is
# a separate companion window; it is not part of the HMI shell. Live tooling and
# power-turret support are UI capabilities here; HAL pin binding is still to be
# added to the lathe simulator.

schema_version = 1
profile = "lathe-sim"
extends = "base.toml"

[machine]
name = "Smartlathe SL36 Simulation"
kind = "sim"
gui = "lathe"
linuxcnc_ini = "../../probe_basic_dev/configs/probe_basic_lathe/probe_basic_lathe.ini"

[lathe]
turret_stations = 12
power_turret = true
live_tooling = true
live_tool_max_rpm = 6000
c_axis = true
y_axis = false
sub_spindle = false

[ui]
window_title = "CNC HMI - Smartlathe SL36 Simulation"

[panel]
kind = "simulated"
label = "Lathe Simulator Panel"
owner = "external"

[panel.link]
kind = "virtual"

[diagnostics]
panel_link_stats = "none"

[simulation]
enabled = true
panel_window = false
