# LiNC's reviewed BaierMill machine configuration.
#
# LiNC's own copy of the live machine configuration in ../../baiermill_pb
# (probe_basic.ini). The machine directory stays untouched: the fixes BaierMill
# needs are LiNC's reviewed Probe Basic subroutine bundle, and this file is what
# selects it. Axes, limits, velocities, homing, PID, ATC, tool table, parameter
# file and HAL wiring are the machine's own values, unchanged; only [DISPLAY],
# [RS274NGC] SUBROUTINE_PATH and the paths that were relative to the machine
# directory differ. Paths below are relative to this file's directory, which is
# where LinuxCNC runs and keeps its working directory.
#
# What must be deployed to the machine:
#   * The complete LiNC bundle subroutines/probe_basic (linc_probe_context.ngc,
#     the angle routines and the traverse-feed corrections). SUBROUTINE_PATH
#     below lists it FIRST, ahead of the machine's own subroutines and the
#     ngcgui library paths, mirroring configs/sim.ini. Without it every
#     generated Run fails on the missing o<linc_probe_context> call.
#   * Check the deployment before running anything:
#       ./target/release/linc --config configs/baiermill-pb.toml --check-config
#     It fails when SUBROUTINE_PATH does not provide every routine a generated
#     Probe Run calls, or when a resolved routine is not LiNC's reviewed copy.
#   * Export LINC_CONFIG=<LiNC>/configs/baiermill-pb.toml for the session, so
#     the [DISPLAY] entry point starts the matching LiNC profile.
#
# Note: the machine's own hallib/szgh_panel.hal launches ./szgh-panel-hal
# relative to the directory LinuxCNC is running in, which is this directory.
# LiNC's panel is its own linc-panel service, so that helper is not provided
# here; see CONFIGURATION.md before starting HAL with this profile.

[EMC]
MACHINE = BaierMill
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = ../scripts/linc-display.sh
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
OPEN_FILE = ~/linuxcnc/nc_files/pb_examples/blank.ngc
CONFIRM_EXIT = False
LOG_FILE = ../../baiermill_pb/mill.log
LOG_LEVEL = INFO
PREFERENCE_FILE = ../../baiermill_pb/mill.pref
CONFIG_FILE = ../../baiermill_pb/custom_config.yml
GCODE_SYNTAX = ../../baiermill_pb/gcode_syntax.yml
POSITION = 0x0
ANGULAR_INCREMENTS = 1 5 10 30 45 90 180 360
INCREMENTS = JOG 10mm 1mm .1mm .01mm

MAX_FEED_OVERRIDE = 2.000000

MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.500000
DEFAULT_SPINDLE_SPEED = 300
MIN_SPINDLE_SPEED = 0
MAX_SPINDLE_SPEED = 12000

DEFAULT_LINEAR_VELOCITY = 60.00000
MAX_LINEAR_VELOCITY = 80.0
MIN_LINEAR_VELOCITY = 0.016670
DEFAULT_ANGULAR_VELOCITY = 36.000000
MAX_ANGULAR_VELOCITY = 360.000000
MIN_ANGULAR_VELOCITY = 1.666667
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = ../../baiermill_pb/pbsplash.png
INTRO_TIME = 5

GEOMETRY = xyz
# USER_TABS_PATH - Set this to enable custom user tabs including NgcGui
# The ngcgui_tab folder should be placed in the user_tabs directory
USER_TABS_PATH = ../../baiermill_pb/user_tabs/
USER_BUTTONS_PATH = ../../baiermill_pb/user_buttons/
USER_DROS_PATH = ../../baiermill_pb/user_dro_display/
DRO_DISPLAY = XYZ
GEOMETRY = XYZ
OFFSET_COLUMNS = XYZR
TOOL_TABLE_COLUMNS = TZDR
KEYBOARD_JOG = false
KEYBOARD_JOG_SAFETY_OFF = false
# ATC tab display options, 0 = no atc tab displayed, 1 = Carousel atc display, 2 = rack atc display
ATC_TAB_DISPLAY = 0
#USER_ATC_BUTTONS_PATH = user_atc_buttons/

# NGCGUI Configuration - Optional preloaded subroutines
# These files should be in your SUBROUTINE_PATH directory
# NGCGUI_PREAMBLE = preamble.ngc
# NGCGUI_POSTAMBLE = postamble.ngc
# NGCGUI_SUBFILE = sub1.ngc sub2.ngc  # Space-separated list of subroutine files to preload

[ATC]
# Carousel images are available for 8, 10, 12, 14, 16, 18, 20, 21, 24 pocket changers
POCKETS = 12
# The Z clearance height in machine coordinates your spindle needs to be at to clear the tools during carousel rotation 
Z_TOOL_CLEARANCE_HEIGHT = 0.0000
# Step Time should be set to the approximate time it takes your ATC to rotate from one pocket to the next entry is in milliseconds(1 second = 1000ms)
# This just adjust the speed of the ATC tab Carousel GFX rotation (default if omitted is 1000ms)
# 
# The Z height your spindle needs to be at to clamp/unclamp a tool from the ATC platter
Z_TOOL_CHANGE_HEIGHT = -194.0
STEP_TIME = 500
TABLE_POCKET_1_X = 4
TABLE_POCKET_1_Y = -3.6
TABLE_POCKET_SPACING = 100
TABLE_POCKET_OFFSET_AFTER_3 = 0
TABLE_POCKET_AXIS = 0

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
    png = image-to-gcode
    gif = image-to-gcode
    jpg = image-to-gcode


[TASK]
TASK = milltask
CYCLE_TIME = 0.01

[RS274NGC]
RS274NGC_STARTUP_CODE = F10 S300 G21 G17 G40 G49 G54 G64 P0.0005 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = ../../baiermill_pb/mill.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
SUBROUTINE_PATH = ../subroutines/probe_basic:../../baiermill_pb/subroutines:~/linuxcnc/nc_files/examples/ngcgui_lib:~/linuxcnc/nc_files/examples/ngcgui_lib/utilitysubs

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.01
BASE_PERIOD = 0
SERVO_PERIOD = 1000000
NUM_DIO = 16
NUM_AIO = 16

[HAL]
HALFILE = ../../baiermill_pb/hallib/rio.hal
HALFILE = ../../baiermill_pb/hallib/pendant.hal
HALFILE = ../hal/baiermill-pb-szgh-panel.hal
POSTGUI_HALFILE = ../hal/baiermill-pb-postgui.hal
TWOPASS = ON
HALUI = halui

[HALUI]
MDI_COMMAND = G92 X0
MDI_COMMAND = G92 Y0
MDI_COMMAND = G92 Z0
MDI_COMMAND = o<whome> call
MDI_COMMAND = o<safez> call
MDI_COMMAND = M19 R0
MDI_COMMAND = o<go_to_home> call


[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.01
DEFAULT_LINEAR_VELOCITY = 60.0
MAX_LINEAR_VELOCITY = 80.0
DEFAULT_ANGULAR_VELOCITY = 60.0
MAX_ANGULAR_VELOCITY = 100.0
NO_FORCE_HOMING = 0
SPINDLES = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.1
TOOL_TABLE = ../../baiermill_pb/tool.tbl

[AXIS_X]
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
MIN_LIMIT          = -372.0
MAX_LIMIT          = 5.0
MIN_FERROR         = 0.01
FERROR             = 0.3

[JOINT_0]
# stepdir0
# Option B PID, Step 4: P tuned (X baseline). FF1=1 velocity ff, I=0 D=0.
P                  = 150.0
I                  = 0.0
D                  = 4.0
BIAS               = 0.0
FF0                = 0.0
FF1                = 1.0
FF2                = 0.0
DEADBAND           = 0.001
MAXOUTPUT          = 300.0
BACKLASH           = 0.03

TYPE               = LINEAR
FERROR             = 0.3
MIN_LIMIT          = -372.0
MAX_LIMIT          = 5.0
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
SCALE              = 1999.2
HOME_SEARCH_VEL    = 30.0
HOME_LATCH_VEL     = -5.0
HOME_FINAL_VEL     = 100.0
HOME_IGNORE_LIMITS = NO
HOME_USE_INDEX     = YES
HOME_INDEX_NO_ENCODER_RESET = NO
HOME_OFFSET        = 0
HOME               = 0.0
HOME_SEQUENCE      = 2

[AXIS_Y]
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
MIN_LIMIT          = -346.0
MAX_LIMIT          = 4.0
MIN_FERROR         = 0.01
FERROR             = 0.3

[JOINT_1]
# stepdir1
# Option B PID, Step 4: P tuned. FF1=1 velocity ff, I=0 D=0.
P                  = 125.0
I                  = 0.0
D                  = 4.0
BIAS               = 0.0
FF0                = 0.0
FF1                = 1.0
FF2                = 0.0
DEADBAND           = 0.001
MAXOUTPUT          = 300.0
BACKLASH           = 0.06

TYPE               = LINEAR
FERROR             = 0.3
MIN_LIMIT          = -346.0
MAX_LIMIT          = 4.0
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
SCALE              = 1999.7469487588498
HOME_SEARCH_VEL    = 30.0
HOME_LATCH_VEL     = 1.0
HOME_FINAL_VEL     = 100.0
HOME_IGNORE_LIMITS = NO
HOME_USE_INDEX     = YES
HOME_INDEX_NO_ENCODER_RESET = NO
HOME_OFFSET        = 0
HOME               = 0.0
HOME_SEQUENCE      = 2

[AXIS_Z]
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
MIN_LIMIT          = -253.0
MAX_LIMIT          = 19.0
MIN_FERROR         = 0.01
FERROR             = 0.3

[JOINT_2]
# stepdir2
# Option B PID: Z gravity ring fixed with D=1; deadband 0.005 silences D-amplified encoder noise.
P                  = 100.0
I                  = 0.0
D                  = 2.0
BIAS               = 0.0
FF0                = 0.0
FF1                = 1.0
FF2                = 0.0
DEADBAND           = 0.003
MAXOUTPUT          = 300.0
BACKLASH           = 0.01

TYPE               = LINEAR
FERROR             = 0.3
MIN_LIMIT          = -253.0
MAX_LIMIT          = 19.0
MAX_VELOCITY       = 80.0
MAX_ACCELERATION   = 500.0
SCALE              = 1000.4
HOME_SEARCH_VEL    = 30.0
HOME_LATCH_VEL     = -5.0
HOME_FINAL_VEL     = 100.0
HOME_IGNORE_LIMITS = NO
HOME_USE_INDEX     = YES
HOME_INDEX_NO_ENCODER_RESET = NO
HOME_OFFSET        = 0
HOME               = 0.0
HOME_SEQUENCE      = 1
